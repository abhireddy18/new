ar(--ink);outline:none}.field input:focus,.field select:focus{border-color:#649187;box-shadow:0 0 0 3px #c8e1d666}.form-grid{grid-template-columns:1fr 1fr}.notice{border:1px solid #e2c77f;background:#fff8e5;border-radius:13px;padding:13px 15px;color:#6d5729;font-size:12px;line-height:1.55;margin:14px 0}.notice.green{background:#eff7f1;border-color:#c5ddc9;color:#406447}.notice.red{background:#fff0eb;border-color:#ebc2b1;color:#904d3c}.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}table{border-collapse:collapse;width:100%;min-width:760px;text-align:left}th{position:sticky;top:0;background:#e2eee8;color:#49655e;font:10px 'DM Mono',monospace;letter-spacing:.09em;text-transform:uppercase;padding:12px}td{border-top:1px solid #efeae1;padding:12px;font-size:12px}tbody tr:hover{background:#f9f7f1}.pill{display:inline-flex;border-radius:50px;padding:5px 9px;font-size:10px;font-weight:700;background:#ece9de;color:#52645e}.pill.Completed{background:#e1f1e3;color:#396847}.pill.Scheduled{background:#e6f0ef;color:#426d65}.pill.New{background:#fff0d1;color:#8b6526}.pill.In-progress{background:#f8e7df;color:#99583f}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:20px 0}.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:11px 14px;font-size:12px;font-weight:700}.tabs button.active{border-color:#c98c31;color:var(--green)}.chart{display:grid;gap:10px;margin-top:20px}.bar-row{display:grid;grid-template-columns:minmax(125px,1.2fr) 3fr 45px;align-items:center;gap:13px}.bar-label{font-size:12px}.bar-track{height:13px;background:#f0eee7;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#426f66,#7fa58e);border-radius:99px}.bar-value{text-align:right;font:12px 'DM Mono',monospace}.kpis{grid-template-columns:repeat(3,1fr);margin:18px 0}.kpi{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fffefa}.kpi b{font:700 24px 'Playfair Display',serif;color:var(--green)}.kpi small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.heat{min-width:700px}.heat td{text-align:center}.heat .cell{display:inline-block;min-width:48px;border-radius:7px;padding:8px 5px;font:11px 'DM Mono',monospace;background:#e5efdd;color:#3c5a42}.heat .cell.mid{background:#d5e8d4}.heat .cell.low{background:#f4eed3;color:#705d2e}.heat .cell.na{background:#f1f0eb;color:#9b9b91}.integration-grid{grid-template-columns:repeat(3,1fr)}.integration{padding:17px;border:1px solid var(--line);border-radius:15px;background:var(--paper)}.integration .brandline{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.integration h3{font:700 18px 'Playfair Display',serif;color:var(--green);margin:0}.integration input{width:100%;margin:6px 0 10px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}.connected{font:10px 'DM Mono',monospace;color:#53906a}.not-connected{font:10px 'DM Mono',monospace;color:#9b8a63}.muted{color:var(--muted)}.hidden{display:none!important}.footer{margin-top:35px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:18px}.mobile-toggle{display:none}.toast{position:fixed;right:25px;bottom:24px;background:var(--deep);color:white;padding:14px 18px;border-radius:13px;box-shadow:var(--shadow);z-index:10;max-width:350px}.link{color:#b87f25;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:900px){.sidebar{width:230px}.main{margin-left:230px}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.integration-grid{grid-template-columns:1fr}.hero-row{align-items:start;flex-direction:column}.service-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.sidebar{position:fixed;inset:auto 0 0;width:100%;height:68px;padding:6px 7px;border-radius:18px 18px 0 0;display:block}.brand,.nav-label,.side-card,.side-bottom{display:none}.nav{height:100%;grid-template-columns:repeat(5,1fr);gap:2px}.nav button{height:55px;padding:6px 2px;flex-direction:column;justify-content:center;gap:2px;border-radius:12px;font-size:9px}.nav .ic{font-size:17px}.main{margin:0}.topbar{height:49px;padding:0 17px}.content{padding:24px 16px 90px}.home-hero{min-height:370px;padding:30px 24px}.home-hero:after{right:-8%;font-size:160px}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:25px}.service-grid{grid-template-columns:1fr 1fr;gap:9px}.service{padding:15px;min-height:155px}.form-grid,.kpis{grid-template-columns:1fr}.bar-row{grid-template-columns:110px 1fr 35px;gap:8px}.hero-row h1{font-size:43px}.table-wrap{margin-left:-1px}}

<body><div class="shell"><aside class="sidebar"><a class="brand" href="#home"><span class="brand-mark">⚒</span><span><span class="brand-name">Appliance</span><span class="brand-sub">C I R C L E</span></span></a><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"><button data-page="home"><span class="ic">⌂</span>Book a repair</button><button data-page="operations"><span class="ic">▤</span>Operations</button><button data-page="plans"><span class="ic">▣</span>Booking plans</button><button data-page="technicians"><span class="ic">⚒</span>Technicians</button><button data-page="analytics"><span class="ic">◷</span>Analytics demo</button></nav><div class="side-card"><strong>✧ THE CIRCLE PROMISE</strong>Good people. Clear pricing. No waiting around wondering what happens next.<a href="#plans">Choose a booking plan ↗</a></div><div class="side-card"><strong>CUSTOMER SERVICE</strong>Need help with payment or booking?<a href="tel:9353967369">9353967369</a></div><div class="side-bottom"><span class="avatar">☻</span><span><b>Circle owner</b><small>BENGALURU / IN</small></span></div></aside><main class="main"><header class="topbar"><span class="online"><i></i>Circle is online</span><span id="today" class="date-chip"></span></header><div class="content" id="view"></div></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const state={page:'home',tab:'overview',customers:[],bookings:[],funnel:[],cohorts:[],technicians:[],plans:[],providers:{}};
const icons={Refrigerator:'🧊',Dishwasher:'🍽️','Air conditioner':'❄️','Washing machine':'🧺','Water heater':'🚿',Plumbing:'🚰'};
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3600)}
async function api(url,opts={}){const r=await fetch(url,{headers:{'content-type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'Something went wrong');return d}
function track(event,properties={}){const row={event,distinct_id:sessionStorage.getItem('ac-demo-id')||'visitor-'+Math.random().toString(36).slice(2,9),time:new Date().toISOString(),properties:{...properties,source:'appliance-circle-web',demo_data:true}};state.liveEvents=state.liveEvents||[];state.liveEvents.push(row);}
function route(page){state.page=page;state.tab=page==='analytics'?'overview':'overview';history.replaceState(null,'','#'+page);render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)route(b.dataset.page)});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['home','operations','plans','technicians','analytics'].includes(p)){state.page=p;render()}});
function shell(title,subtitle,eyebrow,action=''){return `<div class="eyebrow">${eyebrow}</div><div class="hero-row"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function section(title,sub='',action=''){return `<div class="section-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
function stat(label,value,note){return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function statusPill(s){return `<span class="pill ${s.replaceAll(' ','-')}">${esc(s)}</span>`}
function homePage(){return `${`<section class="home-hero"><div class="copy"><div class="eyebrow">HOME REPAIR, WITHOUT THE RUNAROUND</div><h1>Good repairs.<br>Good people.<br>Good as done.</h1><p>Book a trusted local appliance or plumbing pro. Clear visit fees, helpful updates, and real neighbors behind every repair.</p><div class="home-actions"><a class="btn primary" href="#book-form" onclick="track('booking_form_started')">Book a repair <span>↗</span></a><a class="btn" href="#plans">See booking plans</a></div></div></section>`}${section('A little help around the home','Choose a service to get started.') }<div class="grid service-grid">${['Refrigerator','Dishwasher','Air conditioner','Washing machine','Water heater','Plumbing'].map((s,i)=>`<a class="card service" href="#book-form" onclick="selectService('${s}');track('service_category_selected',{service:'${s}'})"><div><span class="service-emoji">${icons[s]}</span><h3>${s}</h3><p>${['Cooling and leaks sorted.','A clean cycle, start to finish.','Comfort through every season.','Quiet, reliable laundry days.','Hot water, safely restored.','Leaks, drains, and fixtures.'][i]}</p></div><span class="arrow">↗</span></a>`).join('')}</div>${section('Book your local pro','Tell us what needs attention. The Circle will follow up to confirm your visit.') }<div class="grid columns"><form id="book-form" class="panel"><h2>Request a repair</h2><p>We’ll confirm your time window and visit fee before dispatch.</p><div class="grid form-grid"><div class="field"><label for="b-name">Your name *</label><input id="b-name" required autocomplete="name" placeholder="First and last name"></div><div class="field"><label for="b-phone">Phone number *</label><input id="b-phone" required autocomplete="tel" placeholder="Your contact number"></div><div class="field"><label for="b-service">Service *</label><select id="b-service" required>${['Refrigerator','Dishwasher','Air conditioner','Washing machine','Water heater','Plumbing'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="b-date">Preferred date</label><input id="b-date" type="date"></div><div class="field"><label for="b-area">Neighborhood *</label><input id="b-area" required placeholder="e.g. JP Nagar"></div><div class="field"><label for="b-issue">What’s the issue?</label><input id="b-issue" placeholder="A short description"></div></div><div class="notice">Visit and diagnosis fee: <b>₹40</b>. Any repair work is quoted before it begins.</div><button class="btn primary" type="submit">Request a visit <span>→</span></button><p id="book-result" class="muted"></p></form><div class="panel"><div class="eyebrow">WHY THE CIRCLE</div><h2 style="margin-top:12px">A better way to get it fixed.</h2><p>One clear visit fee. A local professional matched to your service. An owner who follows the booking all the way through.</p><div class="notice green"><b>What happens next</b><br>1. We review your request.<br>2. We confirm a technician and time.<br>3. You approve the quote before repair.</div><a class="link" href="#technicians">Meet the local network ↗</a><p class="muted" style="margin-top:25px">Serving Bengaluru neighborhoods including JP Nagar, Jayanagar, Banashankari, Kengeri, Basavanagudi, BTM Layout, Konanakunte, and Uttarahalli.</p></div></div>${section('Trusted local hands','Meet the pros in the Circle.') }<div class="grid service-grid">${state.technicians.slice(0,3).map(techCard).join('')}</div><div class="footer">Appliance Circle · Good people. Clear pricing. Synthetic assignment records are labeled where shown.</div>`}
function techCard(t){return `<div class="card" style="display:flex;gap:13px;align-items:center"><div class="avatar" style="background:${t.color};color:var(--green);width:48px;height:48px">${t.name.split(' ').map(x=>x[0]).join('')}</div><div><b>${esc(t.name)}</b><div class="muted" style="font-size:12px;margin-top:4px">${esc(t.trade)} · ★ ${t.rating}</div><div class="muted" style="font-size:11px;margin-top:4px">${esc(t.availability)}</div></div></div>`}
function operationsPage(){const done=state.customers.filter(x=>x.status==='Completed').length;const pending=state.customers.filter(x=>x.status==='New').length;return `${shell('Work worth<br>following<br>through on.','Manage each lead, assign the right local pro, and keep booking status current.','OWNER OPERATIONS / THURSDAY',`<button class="btn" onclick="loadData();toast('View refreshed')">⟳ Refresh view</button>`)}<div class="grid stats">${stat('Assignment sample',state.customers.length,'Synthetic report records')}${stat('New leads',pending,'Read-only assignment examples')}${stat('Completed',done,'Report status count')}${stat('Live requests',state.bookings.length,'Submitted through this website')}</div><div class="notice">Assignment rows below are <b>synthetic, read-only report examples</b>. New visitor requests are shown separately; no sample record is presented as a real customer booking.</div>${section('Live repair requests','Requests submitted on this website can be updated below.')}${state.bookings.length?`<div class="table-wrap"><table><thead><tr><th>Customer / service</th><th>Neighborhood</th><th>Requested</th><th>Status</th><th>Update status</th></tr></thead><tbody>${state.bookings.map(b=>`<tr><td><b>${esc(b.name)}</b><div class="muted">${esc(b.phone)} · ${esc(b.service)}</div></td><td>${esc(b.area)}</td><td>${esc(b.date)}</td><td>${statusPill(b.status)}</td><td><select aria-label="Update status" onchange="updateBooking('${b.id}',this.value)"><option ${b.status==='New'?'selected':''}>New</option><option ${b.status==='Scheduled'?'selected':''}>Scheduled</option><option ${b.status==='In progress'?'selected':''}>In progress</option><option ${b.status==='Completed'?'selected':''}>Completed</option></select></td></tr>`).join('')}</tbody></table></div>`:`<div class="panel empty">No live requests yet. Submit the repair form to see one here.</div>`}${section('Assignment 2 · 30 report records','Copied from the assignment table. For demonstration only.') }<div class="table-wrap"><table><thead><tr><th>#</th><th>Customer</th><th>Date</th><th>Area</th><th>Service</th><th>Status</th><th>Plan</th></tr></thead><tbody>${state.customers.map((c,i)=>`<tr><td>${i+1}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.date)}</td><td>${esc(c.area)}</td><td>${esc(c.service)}</td><td>${statusPill(c.status)}</td><td>${esc(c.plan)}</td></tr>`).join('')}</tbody></table></div><div class="footer">The 30 customer rows, 30-person funnel, and 349-person cohorts are separate datasets in the report.</div>`}
function plansPage(){return `${shell('Choose a plan<br>that feels right.','Simple booking passes for neighbors who want a little more peace of mind.','BOOKING PLANS / CLEAR TERMS')}<div class="grid service-grid">${state.plans.map(p=>`<div class="panel"><div class="eyebrow">${p.tag}</div><h2 style="margin-top:13px">${esc(p.name)}</h2><p>${esc(p.detail)}</p><div class="stat-value">${money(p.price)}<span style="font:13px 'DM Sans';color:var(--muted)"> / ${p.cadence}</span></div><ul class="muted" style="font-size:13px;line-height:2;padding-left:18px"><li>Priority booking access</li><li>Clear visit coordination</li><li>Appliance and plumbing support</li></ul><button class="btn primary" onclick="choosePlan('${p.id}')">Choose this plan →</button></div>`).join('')}</div><div id="plan-form" class="hidden panel" style="margin-top:18px"><h2>Request plan activation</h2><p>Payment is reviewed by the Circle before service dispatch. This demo does not process payments.</p><form id="subscribe-form" class="grid form-grid"><div class="field"><label>Name</label><input id="p-name" required></div><div class="field"><label>Email</label><input id="p-email" type="email" required></div><input id="p-id" type="hidden"><button class="btn primary">Request activation</button></form><p id="plan-result"></p></div><div class="notice">Payment note: plan activation requests are for the class demo. No payment details are collected or charged.</div>`}
function techniciansPage(){return `${shell('Good work starts<br>with good people.','Local specialists ready to help keep your home running.','TECHNICIAN & PLUMBER NETWORK')}<div class="grid service-grid">${state.technicians.map(t=>`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><div class="avatar" style="background:${t.color};color:var(--green);width:54px;height:54px">${t.name.split(' ').map(x=>x[0]).join('')}</div><span class="pill">★ ${t.rating}</span></div><h2 style="margin-top:17px">${esc(t.name)}</h2><p>${esc(t.trade)} specialist</p><div class="muted" style="font-size:12px;line-height:1.9"><div>⌖ ${esc(t.area)}</div><div>✓ ${t.jobs} jobs completed</div><div>◷ ${esc(t.availability)}</div></div><a href="#home" class="btn" style="margin-top:15px" onclick="selectService('${t.trade.includes('Leaks')?'Plumbing':'Refrigerator'}')">Request this pro →</a></div>`).join('')}</div><div class="notice green" style="margin-top:20px">Every technician in this assignment marketplace is a sample profile for the class demonstration.</div>`}
function analyticsPage(){const f=state.funnel,total=state.cohorts.reduce((a,c)=>a+c.size,0);if(state.tab==='funnel')return `${analyticsHeader()}<div class="tabs">${analyticsTabs()}</div><div class="panel"><div class="eyebrow">FIGURE 2 / 30 SIMULATED VISITORS</div><h2 style="margin-top:9px">Booking conversion funnel</h2><p>Each step counts distinct synthetic visitors who reached that event in the report.</p><div class="chart">${f.map((s,i)=>`<div class="bar-row"><div class="bar-label">${esc(s.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(s.users/f[0].users*100,s.users?3:0)}%"></div></div><div class="bar-value">${s.users}</div></div>`).join('')}</div><div class="grid kpis"><div class="kpi"><b>${Math.round(f.at(-1).users/f[0].users*100)}%</b><small>Overall conversion</small></div><div class="kpi"><b>${f[0].users-f.at(-1).users}</b><small>Visitors dropped before repeat booking</small></div><div class="kpi"><b>${Math.round((f[0].users-f[1].users)/f[0].users*100)}%</b><small>Drop-off after site visit</small></div></div><div class="notice">This figure is a simulated assignment funnel, separate from the 30 customer records and the 349-person cohort table.</div></div>`;
if(state.tab==='cohort')return `${analyticsHeader()}<div class="tabs">${analyticsTabs()}</div><div class="panel"><div class="eyebrow">SECTION 5 / WEEKLY RETENTION</div><h2 style="margin-top:9px">Cohort retention</h2><p>Users grouped by first booking week. Cells show the report's retained-user percentage.</p><div class="table-wrap" style="margin-top:18px"><table class="heat"><thead><tr><th>First booking week</th><th>Users</th>${[0,1,2,3,4].map(x=>`<th>Week ${x}</th>`).join('')}</tr></thead><tbody>${state.cohorts.map(c=>`<tr><td><b>${c.week}</b></td><td>${c.size}</td>${c.rates.map(v=>`<td><span class="cell ${v===null?'na':v<7?'low':v<15?'mid':''}">${v===null?'—':v+'%'}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="grid kpis"><div class="kpi"><b>${total}</b><small>Total cohort sample</small></div><div class="kpi"><b>8.6%–20.7%</b><small>Week 1 retention range</small></div><div class="kpi"><b>8.0%</b><small>Mean Week 3 retention</small></div></div><div class="notice">This detailed cohort table contains 349 synthetic users. The PDF's separate dashboard graphic is rounded differently; use this table for the Section 5 calculation.</div></div>`;
if(state.tab==='customers')return `${analyticsHeader()}<div class="tabs">${analyticsTabs()}</div><div class="panel"><div class="eyebrow">SECTION 9.1 / 30 RECORDS</div><h2 style="margin-top:8px">Assignment customer records</h2><p>First names, dates, areas, services, statuses and plans transcribed from the report. All sample rows are synthetic.</p><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>#</th><th>Customer</th><th>Date</th><th>Area</th><th>Service</th><th>Status</th><th>Plan</th></tr></thead><tbody>${state.customers.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${esc(c.date)}</td><td>${esc(c.area)}</td><td>${esc(c.service)}</td><td>${statusPill(c.status)}</td><td>${esc(c.plan)}</td></tr>`).join('')}</tbody></table></div><div class="notice">These 30 records do not feed live bookings, payments, technician dispatch, or subscriptions.</div></div>`;
if(state.tab==='tools')return `${analyticsHeader()}<div class="tabs">${analyticsTabs()}</div><div class="panel"><div class="eyebrow">EVENT COLLECTION / PUBLIC PROJECT TOKENS ONLY</div><h2 style="margin-top:9px">Connect analytics tools</h2><p>Enter a client project token, preview the synthetic assignment stream, and explicitly send it to your own analytics project.</p><div class="notice">Never enter personal or secret API keys. This demo data is synthetic and includes no customer names in analytics events. Keys are kept only in this browser.</div><div class="grid integration-grid">${providerCard('Mixpanel','mixpanel','Project token')}${providerCard('PostHog','posthog','Project API key')}${providerCard('Amplitude','amplitude','Project API key')}</div><div class="section-head"><div><h2>Data collection</h2><p>Generate the 30-visitor funnel and distinct 349-user cohort event stream.</p></div></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="prepareEvents()">◉ Prepare synthetic events</button><button class="btn" onclick="downloadEvents()">↓ Export event CSV</button><button class="btn primary" onclick="sendEvents()">Send to connected tools →</button></div><p id="event-count" class="muted">Ready when you are. Sending happens only after you press the send button.</p><div class="table-wrap" style="margin-top:13px"><table><thead><tr><th>Event</th><th>Anonymous ID</th><th>Report time</th><th>Properties</th></tr></thead><tbody id="event-preview"><tr><td colspan="4" class="muted">Prepare events to preview sample records.</td></tr></tbody></table></div></div>`;
return `${analyticsHeader()}<div class="tabs">${analyticsTabs()}</div><div class="grid stats">${stat('Funnel visitors',f[0]?.users??30,'Figure 2 / simulated')}${stat('Cohort sample',total,'Section 5 / synthetic')}${stat('Report customers',state.customers.length,'Section 9.1 / synthetic')}${stat('Tracking events',state.liveEvents?.length??0,'This browser session')}</div><div class="grid columns"><div class="panel"><div class="eyebrow">FIGURE 2 / FUNNEL</div><h2 style="margin-top:8px">From visit to repeat booking</h2><p>Report values shown as visitors at each step.</p><div class="chart">${f.map(s=>`<div class="bar-row"><div class="bar-label">${esc(s.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(s.users/f[0].users*100,s.users?3:0)}%"></div></div><div class="bar-value">${s.users}</div></div>`).join('')}</div><button class="btn slim" style="margin-top:17px" onclick="analyticsTab('funnel')">Explore funnel →</button></div><div class="panel"><div class="eyebrow">SECTION 5 / COHORTS</div><h2 style="margin-top:8px">Retention by first booking week</h2><p>Week 1 retention, directly from the report's detailed cohort table.</p>${state.cohorts.map(c=>`<div class="bar-row" style="margin:13px 0"><div class="bar-label">${c.week}</div><div class="bar-track"><div class="bar-fill" style="width:${c.rates[1]}%"></div></div><div class="bar-value">${c.rates[1]}%</div></div>`).join('')}<button class="btn slim" style="margin-top:17px" onclick="analyticsTab('cohort')">Explore cohorts →</button></div></div><div class="notice" style="margin-top:18px"><b>Assignment data note.</b> The PDF has multiple simulated datasets. This dashboard keeps the 30 customer rows, 30-visitor funnel, and 349-user cohort dataset separate so their counts remain accurate.</div><div style="margin-top:18px"><button class="btn primary" onclick="analyticsTab('tools')">Set up Mixpanel, PostHog & Amplitude →</button></div>`}
function analyticsHeader(){return shell('See how the<br>Circle moves.','A hands-on view of cohort analysis, funnel analysis, data collection, and analytics tools.','CAT 2 / ASSIGNMENT 2 / ANALYTICS')}
function analyticsTabs(){return [['overview','Overview'],['funnel','Funnel analysis'],['cohort','Cohort analysis'],['customers','Customer data'],['tools','Data collection & tools']].map(([id,label])=>`<button class="${state.tab===id?'active':''}" onclick="analyticsTab('${id}')">${label}</button>`).join('')}
function providerCard(name,id,keyLabel){const saved=state.providers[id]||'';return `<div class="integration"><div class="brandline"><h3>${name}</h3><span class="${saved?'connected':'not-connected'}">${saved?'● CONNECTED':'○ NOT CONNECTED'}</span></div><label class="muted" style="font-size:11px">${keyLabel}</label><input type="password" id="key-${id}" placeholder="Paste public project token" value="${esc(saved)}" autocomplete="off"><button class="btn slim" onclick="saveProvider('${id}')">${saved?'Update':'Connect'} ${name}</button></div>`}
function analyticsTab(tab){state.tab=tab;render()}
function render(){const view=$('#view');$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));view.innerHTML=state.page==='home'?homePage():state.page==='operations'?operationsPage():state.page==='plans'?plansPage():state.page==='technicians'?techniciansPage():analyticsPage();bindForms()}
function bindForms(){const form=$('#book-form');if(form)form.onsubmit=async e=>{e.preventDefault();const d={name:$('#b-name').value,phone:$('#b-phone').value,service:$('#b-service').value,area:$('#b-area').value,date:$('#b-date').value,issue:$('#b-issue').value};try{const row=await api('/api/bookings',{method:'POST',body:JSON.stringify(d)});state.bookings.unshift(row);track('booking_submitted',{service:d.service});$('#book-result').innerHTML='<span class="link">Request received. The Circle will contact you to confirm the visit.</span>';form.reset();toast('Repair request received.');}catch(err){$('#book-result').textContent=err.message}};const sub=$('#subscribe-form');if(sub)sub.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/subscriptions',{method:'POST',body:JSON.stringify({name:$('#p-name').value,email:$('#p-email').value,planId:$('#p-id').value})});$('#plan-result').innerHTML=`<span class="link">${esc(r.message)}</span>`;track('plan_subscription_requested',{plan:$('#p-id').value})}catch(err){$('#plan-result').textContent=err.message}}}
function selectService(s){setTimeout(()=>{const sel=$('#b-service');if(sel)sel.value=s==='Plumbing'?'Plumbing':s},10)}
function choosePlan(id){$('#p-id').value=id;$('#plan-form').classList.remove('hidden');$('#plan-form').scrollIntoView({behavior:'smooth'});track('plan_selected',{plan:id})}
async function updateBooking(id,status){try{const row=await api('/api/bookings/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});state.bookings=state.bookings.map(b=>b.id===id?row:b);render();toast('Booking status updated.')}catch(e){toast(e.message);render()}}
function saveProvider(id){const v=$('#key-'+id).value.trim();if(v){state.providers[id]=v;localStorage.setItem('ac-provider-'+id,v);toast('Project token saved in this browser.')}else{delete state.providers[id];localStorage.removeItem('ac-provider-'+id);toast('Project token cleared.')}render()}
function prepareEvents(){const events=[], base=Date.parse('2026-08-31T09:00:00+05:30');state.funnel.forEach((s,j)=>{for(let i=0;i<s.users;i++)events.push({event:s.event,distinct_id:`assignment-demo-visitor-${String(i+1).padStart(2,'0')}`,time:new Date(base+i*36*3600000+j*12*60000).toISOString(),properties:{demo_data:true,assignment:'CAT 2 / Assignment 2',funnel_stage:s.label,cohort_source:'report-simulation'}})});state.cohorts.forEach(c=>{const start=Date.parse(`2026-${c.week.startsWith('Aug')?'08':'09'}-${c.week.slice(-2)}T09:00:00Z`);for(let i=0;i<c.size;i++){const id=`assignment-demo-cohort-${c.week.replace(' ','-')}-${String(i+1).padStart(3,'0')}`;events.push({event:'cohort_first_booking',distinct_id:id,time:new Date(start+i*1000).toISOString(),properties:{demo_data:true,assignment:'CAT 2 / Assignment 2',cohort_week:c.week,retention_week:0,cohort_source:'report-simulation'}});c.rates.slice(1).forEach((pct,k)=>{if(pct!==null&&i<Math.round(c.size*pct/100))events.push({event:'cohort_weekly_active',distinct_id:id,time:new Date(start+(k+1)*604800000+i*1000).toISOString(),properties:{demo_data:true,assignment:'CAT 2 / Assignment 2',cohort_week:c.week,retention_week:k+1,cohort_source:'report-simulation'}})})}});state.generated=events.sort((a,b)=>a.time.localeCompare(b.time));$('#event-count').textContent=`${state.generated.length} synthetic events prepared. IDs are anonymous; customer names are not included.`;$('#event-preview').innerHTML=state.generated.slice(0,20).map(x=>`<tr><td>${esc(x.event)}</td><td>${esc(x.distinct_id)}</td><td>${esc(x.time)}</td><td>${esc(JSON.stringify(x.properties))}</td></tr>`).join('');}
function downloadEvents(){if(!state.generated)prepareEvents();const rows=[['event','distinct_id','time','properties'],...state.generated.map(e=>[e.event,e.distinct_id,e.time,JSON.stringify(e.properties)])];const csv=rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='appliance-circle-assignment-events.csv';a.click();URL.revokeObjectURL(a.href)}
async function sendEvents(){if(!state.generated)prepareEvents();const providers=Object.entries(state.providers);if(!providers.length){toast('Connect at least one analytics project first.');return}$('#event-count').textContent=`Sending ${state.generated.length} demo events…`;const outcomes=await Promise.all(providers.map(async([id,key])=>{try{if(id==='mixpanel'){const events=state.generated.map(e=>({event:e.event,properties:{token:key,distinct_id:e.distinct_id,time:Math.floor(Date.now()/1000),...e.properties,report_event_time:e.time}}));for(let i=0;i<events.length;i+=100){const r=await fetch('https://api.mixpanel.com/track?strict=1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(events.slice(i,i+100))});if(!r.ok)throw Error(`HTTP ${r.status}`)}}else if(id==='posthog'){const batch=state.generated.map(e=>({event:e.event,distinct_id:e.distinct_id,timestamp:e.time,properties:{...e.properties,report_event_time:e.time}}));const r=await fetch('https://us.i.posthog.com/batch/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({api_key:key,batch,sent_at:new Date().toISOString()})});if(!r.ok)throw Error(`HTTP ${r.status}`)}else{const events=state.generated.map(e=>({event_type:e.event,user_id:e.distinct_id,time:e.time,event_properties:{...e.properties,report_event_time:e.time}}));for(let i=0;i<events.length;i+=1000){const r=await fetch('https://api2.amplitude.com/2/httpapi',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({api_key:key,events:events.slice(i,i+1000)})});if(!r.ok)throw Error(`HTTP ${r.status}`)}}return `${id}: sent`}catch(err){console.warn(id,err);return `${id}: failed (${err.message})`}}));$('#event-count').textContent=`${state.generated.length} synthetic events · ${outcomes.join(' · ')}. Verify receipt in each provider's Live Events.`;toast('Event sending finished. Check each tool’s Live Events.')}
async function loadData(){try{const [d,b]=await Promise.all([api('/api/demo-data'),api('/api/bookings')]);Object.assign(state,d);state.bookings=b;state.providers=Object.fromEntries(['mixpanel','posthog','amplitude'].map(id=>[id,localStorage.getItem('ac-provider-'+id)||'']));}catch(err){console.error(err)}render()}
$('#today').textContent=new Intl.DateTimeFormat('en',{weekday:'short',month:'short',day:'2-digit',year:'numeric'}).format(new Date()).toUpperCase();if(location.hash){const p=location.hash.slice(1);if(['home','operations','plans','technicians','analytics'].includes(p))state.page=p}loadData();
</script></body></html>
